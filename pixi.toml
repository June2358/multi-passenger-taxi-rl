[workspace]
authors = ["Lim Junmin <dsgoat99@naver.com>"]
channels = ["conda-forge"]
name = "RL"
platforms = ["win-64"]
version = "0.1.0"

[dependencies]
numpy = ">=1.26.4,<2"
gymnasium = ">=1.0.0,<2"
stable-baselines3 = ">=2.7.1,<3"
sb3-contrib = ">=2.7.1,<3"
matplotlib = ">=3.10.8,<4"
tensorboard = ">=2.20.0,<3"
optuna = ">=4.6.0,<5"

[pypi-dependencies]
torch = "*"
rl-zoo3 = ">=2.7.0, <3"
pyyaml = "*"

[tasks]
test = "python -m unittest discover -s tests -v"
