[workspace]
authors = ["Lim Junmin <dsgoat99@naver.com>"]
channels = ["conda-forge"]
name = "RL"
platforms = ["win-64"]
version = "0.1.0"

[dependencies]
python = ">=3.13,<3.14"
numpy = ">=2.5.2,<3"
gymnasium = ">=1.3.0,<2"
matplotlib-base = ">=3.11.1,<4"
pytorch = ">=2.13.0,<3"
pyyaml = ">=6.0.3,<7"
optuna = ">=4.9.0,<5"

[pypi-dependencies]
stable-baselines3 = ">=2.9.0,<3"
sb3-contrib = ">=2.9.0,<3"
rl-zoo3 = ">=2.9.1,<3"
tensorboard = ">=2.21.0,<3"

[tasks]
test = "python -m unittest discover -s tests -v"
