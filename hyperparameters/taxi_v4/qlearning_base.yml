# Q-Learning base hyperparameters for Taxi-v4
# RL-Zoo format: environment ID as key
# Uses original Taxi-v4 environment (Discrete 500 states, no wrapper)

Taxi-v4:
  # Q-Learning baseline parameters
  learning_rate: 0.1
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_episodes: 500
  
  # Q-Learning uses original environment (no wrapper)
  # Taxi-v4 already provides Discrete(500) state space, so use it as-is
  # env_wrapper: []  # Empty list or comment out
