# Taxi-v4의 검증된 원본 이산 관찰 DQN 설정.

Taxi-v4:
  policy: MlpPolicy
  learning_rate: 0.001
  exploration_fraction: 0.5
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  buffer_size: 100000
  batch_size: 64
  learning_starts: 5000
  target_update_interval: 1000
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  n_steps: 3
  policy_kwargs: "dict(net_arch=[])"
  n_timesteps: 500000
  n_envs: 1
