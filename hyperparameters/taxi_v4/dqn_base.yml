# Untuned raw-discrete DQN control for Taxi-v4.

Taxi-v4:
  policy: MlpPolicy
  learning_rate: 0.0001
  exploration_fraction: 0.1
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  buffer_size: 1000000
  batch_size: 32
  learning_starts: 100
  target_update_interval: 10000
  gamma: 0.99
  policy_kwargs: "dict(net_arch=[])"
  n_timesteps: 500000
  n_envs: 1
