# MaskablePPO hyperparameters for AdvancedTaxi-v0 custom environment
# Box observation space + Discrete action space + Action Masking
# Optuna best trial 2025-12-15 (study adv_taxi_maskableppo)

AdvancedTaxi-v0:
  # Policy type (MlpPolicy for Box observation space)
  policy: MlpPolicy
  
  # Basic hyperparameters (from best Optuna trial)
  n_steps: 512               # 2**9
  batch_size: 16              # 2**4
  learning_rate: 0.00006
  gamma: 1.0
  gae_lambda: 0.9998664978666149
  clip_range: 0.2
  ent_coef: 0.00000002
  max_grad_norm: 0.7
  
  # Policy network architecture
  policy_kwargs: "dict(net_arch=dict(pi=[256, 256], vf=[256, 256]), activation_fn=nn.ReLU)"
  
  # Environment wrapper: ActionMasker required (uses action_masks() method)
  # Custom wrapper that automatically sets action_mask_fn for RL-Zoo compatibility
  env_wrapper: 
    - envs.wrappers.AdvancedTaxiActionMasker
  
  # n_timesteps is required by RL-Zoo (will be overridden by --n-timesteps)
  n_timesteps: !!float 1e6
  
  # Parallel environments (On-Policy: parallel environments are important)
  n_envs: 8  # Default, can increase to 16 for lightweight environments
  
  # Normalization (VecNormalize). Specified as dict format so RL-Zoo can save/load vecnormalize.pkl
  normalize:
    norm_obs: true
    norm_reward: true
    clip_obs: 10.0
    clip_reward: 10.0
    gamma: 1.0
