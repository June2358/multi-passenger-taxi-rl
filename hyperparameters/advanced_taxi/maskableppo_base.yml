# AdvancedTaxi-v2의 보수적인 MaskablePPO 기준선.

policy: MlpPolicy
n_timesteps: 1000000
n_envs: 8

normalize:
  norm_obs: true
  norm_reward: false
  clip_obs: 10.0
  gamma: 1.0

model_kwargs:
  n_steps: 512
  batch_size: 128
  n_epochs: 5
  learning_rate: 0.0003
  gamma: 1.0
  gae_lambda: 0.97
  clip_range: 0.2
  ent_coef: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.02
  policy_kwargs:
    net_arch:
      pi: [128, 128]
      vf: [128, 128]
    activation_fn: relu
